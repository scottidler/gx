name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@1.96.0
      with:
        components: rustfmt, clippy

    - name: Verify required tools
      run: |
        echo "Verifying Git installation:"
        git --version
        echo "Verifying GitHub CLI installation:"
        gh --version
        echo "Configuring Git for CI:"
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git config --global init.defaultBranch main

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install ripgrep
      run: sudo apt-get install -y ripgrep

    - name: Run tests
      # Unit and e2e tests drive a PATH-shimmed gh; gx still resolves a persona
      # token first and fails loud when the env var is unset. Dummy values.
      env:
        GITHUB_PAT_HOME: ci-dummy-token
        GITHUB_PAT_WORK: ci-dummy-token
      run: cargo test --workspace --verbose

    - name: Check formatting
      run: cargo fmt --all --check

    - name: Run clippy
      run: cargo clippy --workspace -- -D warnings

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@1.96.0
      with:
        components: rustfmt, clippy

    - name: Verify required tools
      run: |
        echo "Verifying Git installation:"
        git --version
        echo "Verifying GitHub CLI installation:"
        gh --version
        echo "Configuring Git for CI:"
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git config --global init.defaultBranch main

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build
      run: cargo build --release --verbose

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gx-${{ matrix.os }}
        path: |
          target/release/gx*
          !target/release/gx.d

