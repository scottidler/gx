name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@1.96.0
      with:
        components: rustfmt, clippy

    - name: Verify required tools
      run: |
        echo "Verifying Git installation:"
        git --version
        echo "Verifying GitHub CLI installation:"
        gh --version
        echo "Configuring Git for CI:"
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git config --global init.defaultBranch main

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install ripgrep
      run: sudo apt-get install -y ripgrep

    - name: Run tests
      timeout-minutes: 8
      run: |
        setsid nohup sh -c 'while true; do date -u; free -m | sed -n 2p; df -h / /tmp | tail -2; uptime; ps -eo pid,ppid,stat,etime,rss,args --sort=-rss | head -8; sleep 20; done' > "$RUNNER_TEMP/sys.log" 2>&1 < /dev/null &
        cargo test --workspace --verbose > "$RUNNER_TEMP/test.log" 2>&1
        rc=$?
        tail -n 200 "$RUNNER_TEMP/test.log"
        exit "$rc"

    - name: Diagnose a failed or hung test step
      if: always()
      run: |
        echo "=== running-over-60s markers"; grep -a "has been running" "$RUNNER_TEMP/test.log" || true
        echo "=== last test lines"; grep -aE "^test |Running " "$RUNNER_TEMP/test.log" | tail -15 || true
        echo "=== tail of test.log"; tail -n 40 "$RUNNER_TEMP/test.log" || true
        echo "=== sys.log tail"; tail -n 60 "$RUNNER_TEMP/sys.log" || true
        echo "=== process table"; ps -efH | tail -40

    - name: Check formatting
      run: cargo fmt --all --check

    - name: Run clippy
      run: cargo clippy --workspace -- -D warnings

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@1.96.0
      with:
        components: rustfmt, clippy

    - name: Verify required tools
      run: |
        echo "Verifying Git installation:"
        git --version
        echo "Verifying GitHub CLI installation:"
        gh --version
        echo "Configuring Git for CI:"
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git config --global init.defaultBranch main

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build
      run: cargo build --release --verbose

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gx-${{ matrix.os }}
        path: |
          target/release/gx*
          !target/release/gx.d

