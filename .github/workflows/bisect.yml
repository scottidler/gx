name: Bisect
on:
  push:
    branches: [ main ]
jobs:
  killsem:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - run: |
        which -a kill; ls -l "$(which kill)"; kill --version 2>&1 | head -2; cat /etc/os-release | head -2
        echo "--- plain form"
        setsid sleep 100 >/dev/null 2>&1 < /dev/null &
        sleep 1; P=$(pgrep -n -x sleep); echo "sleep pid=$P pgid=$(ps -o pgid= -p $P)"
        /usr/bin/kill -KILL -$P; echo "rc=$?"
        sleep 1; ps -eo pid,pgid,stat,args | grep -v grep | grep "sleep 100" || echo "sleeper gone"
        echo "--- done; runner still alive"
  matrix_each:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        t: [test_agent_timeout, test_agent_nonzero, test_garbage_patch, test_empty_diff, test_apply_refuses, test_happy_path]
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.96.0
    - run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git config --global init.defaultBranch main
    - name: ${{ matrix.t }}
      timeout-minutes: 4
      run: cargo test -p gx --test e2e_llm_matrix ${{ matrix.t }} -- --nocapture
