name: Bisect
on:
  push:
    branches: [ main ]
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        t: [e2e_llm_cli, e2e_llm_matrix, e2e_reporting, e2e_undo_lifecycle, integration_tests, lock_contention_test, mcp_handshake_test, mcp_tools_test, remote_status_tests, ssh_integration_tests, status_tests, unified_formatting_tests]
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.96.0
    - run: sudo apt-get install -y ripgrep
    - run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git config --global init.defaultBranch main
    - name: test ${{ matrix.t }}
      timeout-minutes: 4
      run: cargo test -p gx --test ${{ matrix.t }} -- --nocapture
  rest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.96.0
    - run: sudo apt-get install -y ripgrep
    - run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git config --global init.defaultBranch main
    - name: libs and doctests
      timeout-minutes: 5
      run: cargo test --workspace --lib --doc
